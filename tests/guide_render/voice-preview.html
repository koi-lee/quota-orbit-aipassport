<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>口袋景区导览 · 固件界面预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7e5;color:#172b34;font:16px/1.7 system-ui,-apple-system,sans-serif}main{max-width:960px;margin:48px auto;padding:0 24px;display:grid;grid-template-columns:1fr 300px;gap:64px;align-items:center}h1{font-size:34px;line-height:1.3;margin:10px 0 22px}p{max-width:470px}.eyebrow{font-size:13px;letter-spacing:.12em;color:#58725f}.note{font-size:14px;color:#53675a}ul{padding-left:20px}.device{background:#172b34;border-radius:28px;padding:20px 24px 24px;width:288px;box-shadow:0 16px 40px #233c2c18}.screen{display:block;width:240px;height:320px;border-radius:22px;background:#f7f8f3;image-rendering:pixelated}.keys{display:flex;gap:10px;justify-content:center;margin-top:20px}button{font:inherit;cursor:pointer;border:1px solid #c1cebf;border-radius:3px;background:#fff;color:#172b34;min-height:44px;padding:8px 14px}button:hover{background:#c3eddb}button:focus-visible{outline:3px solid #c1b443;outline-offset:3px}button:disabled{opacity:.55;cursor:wait}.device button{background:#91d7ba;min-width:64px}.secondary{display:flex;justify-content:space-between;margin-top:16px;gap:12px}.secondary button{font-size:13px;background:transparent}.status{font-size:13px;min-height:45px;margin:16px 0 0}a{color:inherit}@media(max-width:680px){main{margin:24px auto;grid-template-columns:1fr;gap:24px;padding:0 20px}.device{margin:auto;grid-row:1}h1{font-size:28px}main section:first-child ul{margin-bottom:0}}
</style>
<main><section><div class="eyebrow">POCKET SCENIC GUIDE / v0.3.0 · PIXEL EDITION</div><h1>带上掌机，<br>去看山水。</h1><p>九寨沟 14 个景点，黄龙 8 个景点。选一个地方，看一小段介绍，再和同伴发现一点不同。</p><ul><li>上下键选择景点或切换介绍与小观察。</li><li>确定进入，也可打开喜欢、看过和资料说明。</li><li>更多中选“听介绍”，播报时确定停止，长按返回也会停止。</li></ul><p class="note">右侧直接渲染本次固件的界面与导航代码。预览中的记录仅在当前测试会话模拟，电量未知；音频为固件压缩数据经同一解码器生成，点播才发声；不连接、刷写或读取设备。息屏、按键时序、断电记录和续航仍需真机确认。</p><div class="secondary"><button data-key="b">模拟长按确定 · 返回</button><button data-key="reset">重置预览</button></div><p class="status" id="status" role="status">正在载入界面…</p></section><section class="device" aria-label="240×320 固件界面预览"><img id="screen" class="screen" src="/frame.png" width="240" height="320" alt="导览固件当前画面"><div class="keys"><button data-key="u" aria-label="上键">上</button><button data-key="o">确定</button><button data-key="d" aria-label="下键">下</button></div></section></main>
<script>
const buttons=[...document.querySelectorAll('button')],screen=document.querySelector('#screen'),status=document.querySelector('#status');let busy=false;let voiceId=255,voiceGeneration=0;const narration=new Audio();narration.preload='none';
async function reportVoice(key,generation){while(busy)await new Promise(r=>setTimeout(r,20));if(generation===voiceGeneration)show(key);}
function syncVoice(state,fromKey){const id=state.voice_id??255;if(id===voiceId)return;voiceId=id;const generation=++voiceGeneration;narration.pause();narration.currentTime=0;if(id<22&&fromKey){narration.src='/voice/clip_'+String(id).padStart(2,'0')+'.wav';narration.play().catch(()=>reportVoice('failed',generation));}else if(id<22){reportVoice('ended',generation);}}
narration.addEventListener('ended',()=>reportVoice('ended',voiceGeneration));narration.addEventListener('error',()=>{if(voiceId<22)reportVoice('failed',voiceGeneration);});
async function show(key){if(busy)return;busy=true;buttons.forEach(b=>b.disabled=true);try{let response=await fetch(key?'/key':'/state',key?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})}:{});let state=await response.json();if(!response.ok)throw Error(state.error||'预览暂不可用');screen.src='/frame.png?t='+Date.now();syncVoice(state,!!key);status.textContent=`模拟记录：看过 ${state.seen} 个 · 喜欢 ${state.liked} 个。键盘 ↑ ↓、Enter、Esc 也可操作。`;}catch(e){status.textContent='预览加载失败，请重试或刷新页面。';}finally{busy=false;buttons.forEach(b=>b.disabled=false);}}
buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset.key)));document.addEventListener('keydown',e=>{if(e.repeat||e.target.closest('button'))return;const key={ArrowUp:'u',ArrowDown:'d',Enter:'o',Escape:'b'}[e.key];if(key){e.preventDefault();show(key);}});show();
</script></html>

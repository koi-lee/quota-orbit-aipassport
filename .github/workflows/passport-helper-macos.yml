name: Passport helper macOS compatibility

on:
  pull_request:
    paths:
      - "tools/lan-quota/**"
      - ".github/workflows/passport-helper-macos.yml"
  push:
    branches: [main]
    paths:
      - "tools/lan-quota/**"
      - ".github/workflows/passport-helper-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ARM64 preview on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install verified official Python in the disposable runner
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          curl --fail --location --retry 2 --max-time 180 \
            https://www.python.org/ftp/python/3.13.16/python-3.13.16-macos11.pkg \
            --output "$RUNNER_TEMP/passport-python.pkg"
          printf '%s  %s\n' \
            30666509020b4da0dd8bc2e773255f34d76b7bb80b66960a928d5f6daa0192d7 \
            "$RUNNER_TEMP/passport-python.pkg" | shasum --algorithm 256 --check
          pkgutil --check-signature "$RUNNER_TEMP/passport-python.pkg"
          sudo installer -pkg "$RUNNER_TEMP/passport-python.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13 \
            -m venv "$RUNNER_TEMP/passport-python-env"
          "$RUNNER_TEMP/passport-python-env/bin/python" -m pip install \
            --only-binary=:all: -r tools/lan-quota/requirements-macos.txt

      - name: Test, build and audit candidate
        run: |
          passport_python="$RUNNER_TEMP/passport-python-env/bin/python"
          "$passport_python" -m unittest discover -s tools/lan-quota -p 'test_*.py'
          "$passport_python" tools/lan-quota/build_macos.py \
            --output "$RUNNER_TEMP/helper-compat" --version 0.3.3 --minimum-macos 11.0
          "$passport_python" tools/lan-quota/smoke_macos.py \
            "$RUNNER_TEMP/helper-compat/dist/StarshorePassport.app" \
            --report "$RUNNER_TEMP/helper-compat/runtime-smoke.json"
          sw_vers > "$RUNNER_TEMP/helper-compat/tested-os.txt"

      - name: Archive unsigned test candidate and evidence
        run: |
          cd "$RUNNER_TEMP/helper-compat"
          ditto -c -k --sequesterRsrc --keepParent dist/StarshorePassport.app \
            StarshorePassport-AppleSilicon-0.3.3-unsigned.zip
          shasum --algorithm 256 StarshorePassport-AppleSilicon-0.3.3-unsigned.zip > SHA256SUMS.txt

      - name: Upload candidate for review, not as a public release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: passport-helper-compat-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/helper-compat/StarshorePassport-AppleSilicon-0.3.3-unsigned.zip
            ${{ runner.temp }}/helper-compat/bundle-audit.json
            ${{ runner.temp }}/helper-compat/build-manifest.json
            ${{ runner.temp }}/helper-compat/runtime-smoke.json
            ${{ runner.temp }}/helper-compat/tested-os.txt
            ${{ runner.temp }}/helper-compat/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

name: Mac helper / Mac 同步助手 / Mac 同步助手
description: Report installation, pairing, or sync problems / 安装、配对、同步问题 / 安裝、配對、同步問題
title: "[Mac helper] "
body:
  - type: markdown
    attributes:
      value: |
        Please do not upload pairing files, credentials, personal quota, or unreviewed logs.
        请勿上传配对文件、登录凭据、个人额度或未经检查的日志。
        請勿上傳配對檔案、登入憑證、個人額度或未經檢查的記錄。
  - type: input
    id: helper_version
    attributes:
      label: Helper version or ZIP filename / 助手版本或安装包名 / 助手版本或安裝包名
      placeholder: 0.3.0 / unknown / 不确定 / 不確定
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: macOS version and chip / macOS 版本与芯片 / macOS 版本與晶片
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Community firmware version, if known / 社区固件版本（如知道）/ 社群韌體版本（如知道）
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result / 操作步骤与预期结果 / 操作步驟與預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and exact message / 实际结果与错误原文 / 實際結果與錯誤原文
      description: Does it happen every time? Redact screenshots before attaching. / 是否必现？截图请先脱敏。/ 是否每次發生？截圖請先去除私人資訊。
    validations:
      required: true

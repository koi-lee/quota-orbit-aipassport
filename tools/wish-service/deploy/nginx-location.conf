# Candidate only: insert inside the existing HTTPS server after review.
# Uses its own per-network zone so website polling cannot starve uploads.
location = /quota-orbit/api/passport/wishes {
    client_max_body_size 2k;
    client_body_timeout 5s;
    limit_req zone=codex_passport_wishes burst=6 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_pass http://127.0.0.1:8970;
}
